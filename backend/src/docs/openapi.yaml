              description: Calculado. Promedio de las reseñas de sus eventos; null si no tiene
              example: 4.5
            cantidadResenias:
              type: integer
              example: 2
        tiposEntrada:
          type: array
          items:
            $ref: '#/components/schemas/TipoEntrada'
    EventoResumen:
      type: object
      description: Un evento en el catálogo, sin los tipos de entrada
      properties:
        id:
          type: integer
          example: 2
        nombre:
          type: string
          example: La casa de Bernarda Alba
        lugar:
          type: string
          example: Teatro San Martín, Av. Corrientes 1530, CABA
        fecha:
          type: string
          format: date-time
          example: '2026-11-07T23:00:00.000Z'
        imagen:
          type: string
          nullable: true
          description: Primera URL de multimedia, o null si no tiene
          example: https://picsum.photos/seed/bernarda/800/400
        categoria:
          type: object
          properties:
            id:
              type: integer
              example: 2
            nombre:
              type: string
              example: Teatro
        organizador:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nombre:
              type: string
              example: Lucía
            apellido:
              type: string
              example: Fernández
            puntaje:
              type: number
              nullable: true
              description: Calculado. Promedio de las reseñas de sus eventos; null si no tiene
              example: 4.5
            cantidadResenias:
              type: integer
              example: 2
        precioDesde:
          type: number
          description: Calculado. Precio de su entrada más barata
          example: 20000
    EventoOrganizado:
      description: Un evento en Mis eventos del organizador
      allOf:
        - $ref: '#/components/schemas/EventoResumen'
        - type: object
          properties:
            sinResponder:
              type: integer
              description: >-
                Calculado. Cantidad de compras del evento cuyo chat espera la respuesta
                del organizador (el último mensaje es del comprador). 0 si no hay ninguna
              example: 1
    CambioEstadoCompra:
      type: object
      properties:
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, UTILIZADA, CANCELADA, REEMBOLSADA]
        usuarioId:
          type: integer
          description: Quién hizo el cambio
        fechaHora:
          type: string
          format: date-time
    Mensaje:
      type: object
      properties:
        usuarioId:
          type: integer
        mensaje:
          type: string
        enviado:
          type: string
          format: date-time
    ReseniaDetalle:
      type: object
      properties:
        id:
          type: integer
          example: 3
        comprador:
          type: object
          properties:
            id:
              type: integer
              example: 3
            nombre:
              type: string
              example: Sofía
            apellido:
              type: string
              example: Pérez
        evento:
          type: object
          properties:
            id:
              type: integer
              example: 6
            nombre:
              type: string
              example: Noche de Stand-up
            fecha:
              type: string
              format: date-time
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        detalle:
          type: string
          example: Muy divertido, aunque el sonido fallaba atrás.
    MensajeConAutor:
      type: object
      properties:
        autor:
          type: object
          properties:
            id:
              type: integer
              example: 3
            nombre:
              type: string
              example: Sofía
            apellido:
              type: string
              example: Pérez
        mensaje:
          type: string
          example: ¿Se puede entrar con mochila?
        enviado:
          type: string
          format: date-time
    CompraDetalle:
      type: object
      properties:
        id:
          type: integer
          example: 10
        evento:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nombre:
              type: string
              example: Noche de Rock Nacional
            fecha:
              type: string
              format: date-time
            lugar:
              type: string
              example: Estadio Obras, Av. del Libertador 7395, CABA
            organizadorId:
              type: integer
              example: 1
        tipoEntrada:
          type: object
          properties:
            id:
              type: integer
              example: 2
            nombre:
              type: string
              example: Platea
            precio:
              type: number
              example: 80000
        comprador:
          type: object
          properties:
            id:
              type: integer
              example: 3
            nombre:
              type: string
              example: Sofía
            apellido:
              type: string
              example: Pérez
        cantidad:
          type: integer
          example: 2
        total:
          type: number
          description: Precio al momento de comprar × cantidad
          example: 160000
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, UTILIZADA, CANCELADA, REEMBOLSADA]
          example: PENDIENTE
        historial:
          type: array
          description: Cambios de estado en orden cronológico
          items:
            $ref: '#/components/schemas/CambioEstadoCompra'
        mensajes:
          type: array
          description: Chat de la compra
          items:
            $ref: '#/components/schemas/Mensaje'
        diasRestantes:
          type: integer
          nullable: true
          description: >-
            Calculado. Días de calendario hasta el evento (0 = hoy). Solo si la
            compra está CONFIRMADA y el evento no se realizó; si no, null.
          example: 20
        resenia:
          type: object
          nullable: true
          description: >-
            La reseña que dejó el comprador para el evento de la compra, o null si
            todavía no reseñó. La app la muestra en lugar del formulario.
          properties:
            id:
              type: integer
              example: 1
            puntuacion:
              type: integer
              example: 5
            detalle:
              type: string
              example: Sonido impecable y muy buena organización en la entrada.
    NuevaCompra:
      type: object
      required: [eventoId, tipoEntradaId, cantidad]
      properties:
        eventoId:
          type: integer
        tipoEntradaId:
          type: integer
          description: Id del tipo de entrada dentro del evento (1, 2, 3…)
        cantidad:
          type: integer
          minimum: 1
      example:
        eventoId: 1
        tipoEntradaId: 2
        cantidad: 2
    NuevoEvento:
      type: object
      required: [nombre, descripcion, lugar, categoriaId, fecha, tiposEntrada]
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        lugar:
          type: string
        categoriaId:
          type: integer
        fecha:
          type: string
          format: date-time
          description: Tiene que ser futura
        multimedia:
          type: array
          description: URLs de imágenes (http o https). Si falta, queda vacío.
          items:
            type: string
        tiposEntrada:
          type: array
          minItems: 1
          items:
            type: object
            required: [nombre, descripcion, precio, cupo]
            properties:
              nombre:
                type: string
              descripcion:
                type: string
              precio:
                type: number
                minimum: 0
              cupo:
                type: integer
                minimum: 1
      example:
        nombre: Meetup de JavaScript
        descripcion: Charlas cortas sobre el ecosistema JS
        lugar: UTN FRBA, Medrano 951, CABA
        categoriaId: 5
        fecha: '2027-03-15T19:00:00.000Z'
        multimedia: []
        tiposEntrada:
          - nombre: General
            descripcion: Entrada libre con registro
            precio: 0
            cupo: 100
          - nombre: Con certificado
            descripcion: Incluye certificado de asistencia
            precio: 5000
            cupo: 30
  responses:
    IdInvalido:
      description: El id no es un número válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: El campo id tiene que ser un id válido
    CompraNoEncontrada:
      description: No existe la compra
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: No existe la compra 99
    SinUsuarioActivo:
      description: Falta el header X-User-Id, es inválido o el usuario no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Falta indicar el usuario activo
    ErrorInterno:
      description: Error no previsto del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Error interno del servidor
