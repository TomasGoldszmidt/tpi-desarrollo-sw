openapi: 3.0.3
info:
  title: AI Ticket It API
  description: >-
    Backend de AI Ticket It, plataforma de venta de entradas para eventos.
    Persistencia en memoria: los datos vuelven al seed en cada reinicio.


    Respuestas comunes a todas las rutas, además de las que documenta cada una:
    404 si la URL no existe; 405 (con el header Allow) si la URL existe pero no
    acepta ese método; 400 si el cuerpo no es un JSON válido; 413 si el cuerpo
    pasa los 100 KB. Todos los errores tienen la forma { "error": "mensaje" }.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: Sistema
    description: Estado del servidor
  - name: Usuarios
    description: Usuarios del sistema, su registro y la edición del perfil
  - name: Sesiones
    description: Inicio de sesión con email y contraseña
  - name: Categorias
    description: Categorías para explorar y clasificar los eventos
  - name: Eventos
    description: Eventos con sus tipos de entrada
  - name: Compras
    description: Compras de entradas y sus cambios de estado
  - name: Resenias
    description: Reseñas de los eventos, que forman el puntaje del organizador
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verificar que el servidor está activo
      operationId: health
      responses:
        '200':
          description: El servidor responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar los usuarios
      description: Público. No incluye el email ni la contraseña de nadie.
      operationId: listUsuarios
      responses:
        '200':
          description: Todos los usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Usuarios]
      summary: Registrar un usuario
      description: >-
        Crea la cuenta y la devuelve con el email; la app entra con ese usuario
        y manda su id en el header X-User-Id. El email se guarda en minúsculas y
        no puede repetirse. La contraseña se guarda con hash.
      operationId: createUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, email, contrasenia]
              properties:
                nombre:
                  type: string
                  maxLength: 50
                apellido:
                  type: string
                  maxLength: 50
                email:
                  type: string
                  format: email
                contrasenia:
                  type: string
                  minLength: 8
                  maxLength: 100
            example:
              nombre: Camila
              apellido: Ríos
              email: camila@gmail.com
              contrasenia: camila1234
      responses:
        '201':
          description: La cuenta creada
          headers:
            Location:
              description: URL del usuario creado
              schema:
                type: string
                example: /usuarios/5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          description: Falta un campo o es inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: La contraseña tiene que tener al menos 8 caracteres
        '409':
          description: Ya hay una cuenta con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Ya hay una cuenta con ese email.
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Ver un usuario con su puntaje de organizador
      description: >-
        Público. El puntaje es el promedio de las reseñas de los eventos que
        organiza; si no organiza nada o no tiene reseñas, puntaje es null y
        cantidadResenias es 0. La app lo usa en la pantalla de reseñas del organizador.
      operationId: getUsuarioById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: El usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPerfil'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          description: No existe el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el usuario 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags: [Usuarios]
      summary: Editar el perfil
      description: >-
        Solo el propio usuario activo. Se mandan solo los campos que cambian.
        Para cambiar la contraseña hay que mandar contraseniaActual y contraseniaNueva.
      operationId: updateUsuario
      security:
        - usuarioActivo: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nombre:
                  type: string
                  maxLength: 50
                apellido:
                  type: string
                  maxLength: 50
                email:
                  type: string
                  format: email
                contraseniaActual:
                  type: string
                contraseniaNueva:
                  type: string
                  minLength: 8
                  maxLength: 100
            example:
              apellido: Ramírez
              contraseniaActual: sofia1234
              contraseniaNueva: sofia5678
      responses:
        '200':
          description: La cuenta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          description: >-
            El id o un campo es inválido, no hay cambios, o se pidió cambiar la
            contraseña sin mandar la actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Para cambiar la contraseña ingresá la actual.
        '401':
          description: Falta el usuario activo, o la contraseña actual no es correcta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: La contraseña actual no es correcta.
        '403':
          description: El usuario activo no es el del perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Solo podés editar tu propio perfil.
        '404':
          description: No existe el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el usuario 99
        '409':
          description: El email ya lo usa otra cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Ya hay una cuenta con ese email.
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{id}/eventos:
    get:
      tags: [Usuarios, Eventos]
      summary: Ver los eventos de un organizador
      description: >-
        Los eventos que organiza el usuario, incluidos los que ya se realizaron,
        ordenados por fecha. La app lo usa con el usuario activo para entrar a las
        ventas de cada evento. Cada evento trae cuántas compras tienen mensajes que el
        organizador todavía no leyó (`conMensajesNoLeidos`). Si no organiza nada, devuelve [].
      operationId: listEventosOrganizador
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Los eventos que organiza (puede ser vacío)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoOrganizado'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          description: No existe el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el usuario 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{id}/resenias:
    get:
      tags: [Usuarios, Resenias]
      summary: Ver las reseñas de un organizador
      description: >-
        Las reseñas de todos los eventos que organiza el usuario, del evento más
        reciente al más viejo. Si no organiza nada o no tiene reseñas, devuelve [].
      operationId: listReseniasOrganizador
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Las reseñas (puede ser vacío)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReseniaDetalle'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          description: No existe el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el usuario 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{id}/favoritos:
    get:
      tags: [Usuarios]
      summary: Listar mis eventos favoritos
      description: >-
        Solo el propio usuario activo. Los eventos con la misma forma que en el
        catálogo, ordenados por fecha e incluidos los que ya se realizaron.
      operationId: listFavoritos
      security:
        - usuarioActivo: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      responses:
        '200':
          description: Los eventos favoritos (puede ser vacío)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoResumen'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          $ref: '#/components/responses/FavoritosAjenos'
        '404':
          description: No existe el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el usuario 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{id}/favoritos/{eventoId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 3
      - name: eventoId
        in: path
        required: true
        schema:
          type: integer
        example: 1
    put:
      tags: [Usuarios]
      summary: Marcar un evento como favorito
      description: >-
        Solo el propio usuario activo. Marcar uno que ya es favorito no da error
        ni lo duplica.
      operationId: addFavorito
      security:
        - usuarioActivo: []
      responses:
        '204':
          description: El evento quedó como favorito
        '400':
          description: El id o el eventoId no es un número válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El campo eventoId tiene que ser un id válido
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          $ref: '#/components/responses/FavoritosAjenos'
        '404':
          description: No existe el usuario o el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el evento 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [Usuarios]
      summary: Quitar un evento de favoritos
      description: >-
        Solo el propio usuario activo. Quitar uno que no era favorito no da error.
      operationId: removeFavorito
      security:
        - usuarioActivo: []
      responses:
        '204':
          description: El evento ya no es favorito
        '400':
          description: El id o el eventoId no es un número válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El campo eventoId tiene que ser un id válido
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          $ref: '#/components/responses/FavoritosAjenos'
        '404':
          description: No existe el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el usuario 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{id}/notificaciones:
    get:
      tags: [Usuarios]
      summary: Listar mis notificaciones
      description: >-
        Solo el propio usuario activo. No se guardan: se calculan con lo que hizo
        otra persona en una compra en la que participa (como comprador o como
        organizador del evento) y con las reseñas de sus eventos. Van de la más
        reciente a la más vieja; `leida` es true si es anterior a la última vez
        que las marcó todas como leídas, si la abrió (PUT
        /usuarios/{id}/notificaciones/{notificacionId}/lectura) o, si es un mensaje,
        si ya abrió ese chat después (PUT /compras/{id}/mensajes/lectura).
      operationId: listNotificaciones
      security:
        - usuarioActivo: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Las notificaciones (puede ser vacío)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificacion'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          $ref: '#/components/responses/NotificacionesAjenas'
        '404':
          description: No existe el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el usuario 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{id}/notificaciones/lectura:
    put:
      tags: [Usuarios]
      summary: Marcar todas mis notificaciones como leídas
      description: >-
        Solo el propio usuario activo. Todas las notificaciones hasta este momento
        quedan como leídas; las que lleguen después vuelven a ser nuevas.
      operationId: markReadNotificaciones
      security:
        - usuarioActivo: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '204':
          description: Quedaron marcadas como leídas
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          $ref: '#/components/responses/NotificacionesAjenas'
        '404':
          description: No existe el usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el usuario 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios/{id}/notificaciones/{notificacionId}/lectura:
    put:
      tags: [Usuarios]
      summary: Marcar una notificación como leída
      description: >-
        Solo el propio usuario activo. Se usa al abrir una notificación: solo esa
        queda leída. Marcarla de nuevo no cambia nada.
      operationId: markOneReadNotificacion
      security:
        - usuarioActivo: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 4
        - name: notificacionId
          in: path
          required: true
          description: El `id` que trae la notificación en GET /usuarios/{id}/notificaciones
          schema:
            type: string
          example: compra-1-mensaje-1
      responses:
        '204':
          description: Quedó marcada como leída
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          $ref: '#/components/responses/NotificacionesAjenas'
        '404':
          description: No existe el usuario, o la notificación no es una de las suyas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe la notificación compra-99-mensaje-0
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesiones:
    post:
      tags: [Sesiones]
      summary: Iniciar sesión
      description: >-
        Verifica email y contraseña y devuelve la cuenta. No guarda una sesión:
        después la app manda el id en el header X-User-Id. Si el email no existe
        o la contraseña no coincide, el error es el mismo. Cuentas del seed:
        <nombre>@aiticketit.com con contraseña <nombre>1234 (lucia, martin, sofia, juan).
      operationId: createSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, contrasenia]
              properties:
                email:
                  type: string
                  format: email
                contrasenia:
                  type: string
            example:
              email: sofia@aiticketit.com
              contrasenia: sofia1234
      responses:
        '200':
          description: La cuenta del usuario que inició sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          description: Falta el email o la contraseña, o el email es inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Falta el campo email
        '401':
          description: El email o la contraseña no son correctos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El email o la contraseña no son correctos.
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /categorias:
    get:
      tags: [Categorias]
      summary: Listar las categorías
      operationId: listCategorias
      responses:
        '200':
          description: Todas las categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /eventos:
    get:
      tags: [Eventos]
      summary: Buscar eventos
      description: >-
        Solo muestra eventos que todavía no se realizaron. Todos los filtros son
        opcionales. Orden: fecha y precio de menor a mayor; puntaje de mayor a
        menor, con los organizadores sin reseñas al final. Si empatan, desempata
        la fecha y después el id. Viene de a páginas.
      operationId: listEventos
      parameters:
        - name: texto
          in: query
          description: Se busca en el nombre, la descripción y el lugar, sin distinguir mayúsculas ni tildes
          schema:
            type: string
          example: rock
        - name: categoriaId
          in: query
          schema:
            type: integer
          example: 1
        - name: precioMin
          in: query
          description: Algún tipo de entrada tiene que costar al menos esto
          schema:
            type: number
            minimum: 0
        - name: precioMax
          in: query
          description: Algún tipo de entrada tiene que costar como mucho esto
          schema:
            type: number
            minimum: 0
        - name: orden
          in: query
          schema:
            type: string
            enum: [fecha, precio, puntaje]
            default: fecha
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Una página de los eventos que cumplen los filtros (puede ser vacía)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    required: [resultados]
                    properties:
                      resultados:
                        type: array
                        items:
                          $ref: '#/components/schemas/EventoResumen'
        '400':
          description: >-
            Un filtro tiene un formato inválido, precioMin es mayor que precioMax,
            o pagina o limite no son enteros en rango (o vienen repetidos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'El campo orden tiene que ser uno de: fecha, precio, puntaje'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Eventos]
      summary: Crear un evento con sus tipos de entrada
      description: >-
        El organizador es el usuario activo. La categoría tiene que existir, la
        fecha tiene que ser futura y los tipos de entrada no pueden repetir nombre
        (sin distinguir mayúsculas).
      operationId: createEvento
      security:
        - usuarioActivo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoEvento'
      responses:
        '201':
          description: El evento creado, con la misma forma que el detalle
          headers:
            Location:
              description: URL del evento creado
              schema:
                type: string
              example: /eventos/7
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDetalle'
        '400':
          description: Falta un campo, tiene un formato inválido o la categoría no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El campo tiposEntrada[0].cupo tiene que ser como mínimo 1
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '409':
          description: La fecha no es futura o hay tipos de entrada con el nombre repetido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: La fecha del evento tiene que ser futura
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /eventos/{id}:
    get:
      tags: [Eventos]
      summary: Ver el detalle de un evento
      description: Incluye las entradas disponibles de cada tipo, calculadas con las compras que ocupan cupo, y el puntaje del organizador.
      operationId: getEventoById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      responses:
        '200':
          description: El evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDetalle'
        '400':
          description: El id no es un número válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El campo id tiene que ser un id válido
        '404':
          description: No existe el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el evento 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /eventos/{id}/compras:
    get:
      tags: [Eventos]
      summary: Ver las ventas de un evento
      description: >-
        Todas las compras del evento, en cualquier estado, de la más reciente a la
        más vieja. Solo para el organizador. Las entradas disponibles por tipo
        salen de GET /eventos/{id}.
      operationId: listComprasEvento
      security:
        - usuarioActivo: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Las compras del evento (puede ser vacío)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompraDetalle'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          description: El usuario activo no es el organizador del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Solo el organizador puede ver las ventas de este evento
        '404':
          description: No existe el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el evento 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /compras:
    get:
      tags: [Compras]
      summary: Listar mis compras
      description: >-
        Las compras del usuario activo como comprador, de la más reciente a la más
        vieja. Cada una trae `diasRestantes` si está CONFIRMADA.
      operationId: listCompras
      security:
        - usuarioActivo: []
      responses:
        '200':
          description: Las compras del usuario activo (puede ser vacío)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompraDetalle'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Compras]
      summary: Comprar entradas
      description: >-
        El comprador es el usuario activo. La compra arranca PENDIENTE y ya ocupa
        cupo. El total lo calcula el servidor (precio × cantidad). No se puede
        comprar en un evento pasado, sin cupo suficiente, ni en un evento que el
        usuario organiza.
      operationId: createCompra
      security:
        - usuarioActivo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaCompra'
      responses:
        '201':
          description: La compra creada
          headers:
            Location:
              description: URL de la compra creada
              schema:
                type: string
              example: /compras/10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDetalle'
        '400':
          description: Falta un campo o es inválido, o no existe el evento o el tipo de entrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El evento no tiene el tipo de entrada 9
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '409':
          description: El evento ya se realizó, no hay cupo suficiente o el usuario organiza el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'No hay cupo suficiente: quedan 0 entradas'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /compras/{id}:
    get:
      tags: [Compras]
      summary: Ver el detalle de una compra
      description: La pueden ver el comprador y el organizador del evento.
      operationId: getCompraById
      security:
        - usuarioActivo: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: La compra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDetalle'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          description: El usuario activo no es el comprador ni el organizador del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No podés ver esta compra
        '404':
          $ref: '#/components/responses/CompraNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /compras/{id}/pago:
    post:
      tags: [Compras]
      summary: Pagar una compra
      description: >-
        Pago simulado: PENDIENTE → CONFIRMADA. Solo lo puede hacer el comprador y
        antes de que el evento se realice.
      operationId: payCompra
      security:
        - usuarioActivo: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: La compra confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDetalle'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          description: El usuario activo no es el comprador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No podés pasar esta compra a CONFIRMADA
        '404':
          $ref: '#/components/responses/CompraNoEncontrada'
        '409':
          description: La compra no está PENDIENTE o el evento ya se realizó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No se puede pasar de CONFIRMADA a CONFIRMADA
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /compras/{id}/utilizacion:
    post:
      tags: [Compras]
      summary: Marcar una compra como utilizada
      description: >-
        CONFIRMADA → UTILIZADA. Solo lo puede hacer el organizador del evento,
        desde las 00:00 del día del evento. Habilita al comprador a reseñar.
      operationId: markUtilizadaCompra
      security:
        - usuarioActivo: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: La compra utilizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDetalle'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          description: El usuario activo no es el organizador del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No podés pasar esta compra a UTILIZADA
        '404':
          $ref: '#/components/responses/CompraNoEncontrada'
        '409':
          description: La compra no está CONFIRMADA o todavía no es el día del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Todavía no es el día del evento
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /compras/{id}/cancelacion:
    post:
      tags: [Compras]
      summary: Cancelar una compra
      description: >-
        Solo lo puede hacer el comprador y antes de que el evento se realice. Una
        compra PENDIENTE queda CANCELADA; una CONFIRMADA queda REEMBOLSADA (se le
        devuelve el `total`, de forma simulada). Una compra UTILIZADA, CANCELADA o
        REEMBOLSADA no se puede cancelar. En los dos casos se libera el cupo.
      operationId: cancelCompra
      security:
        - usuarioActivo: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: La compra cancelada o reembolsada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDetalle'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          description: El usuario activo no es el comprador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No podés pasar esta compra a REEMBOLSADA
        '404':
          $ref: '#/components/responses/CompraNoEncontrada'
        '409':
          description: La compra no se puede cancelar por su estado o el evento ya se realizó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No se puede cancelar una compra UTILIZADA
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /compras/{id}/mensajes:
    get:
      tags: [Compras]
      summary: Ver el chat de una compra
      description: >-
        Mensajes del más viejo al más nuevo, cada uno con su autor. Solo para el
        comprador y el organizador del evento.
      operationId: listMensajesCompra
      security:
        - usuarioActivo: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Los mensajes (puede ser vacío)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MensajeConAutor'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          description: El usuario activo no es el comprador ni el organizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Solo el comprador y el organizador pueden ver este chat
        '404':
          $ref: '#/components/responses/CompraNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Compras]
      summary: Enviar un mensaje en el chat de una compra
      description: >-
        El comprador y el organizador pueden escribir en cualquier momento, sin
        importar el estado de la compra ni si el evento ya se realizó. Para quien
        escribe, el chat queda leído hasta ese mensaje.
      operationId: createMensajeCompra
      security:
        - usuarioActivo: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mensaje]
              properties:
                mensaje:
                  type: string
                  maxLength: 500
            example:
              mensaje: ¿A qué hora abren las puertas?
      responses:
        '201':
          description: El mensaje enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeConAutor'
        '400':
          description: El id es inválido, o el mensaje está vacío o tiene más de 500 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Falta el campo mensaje
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          description: El usuario activo no es el comprador ni el organizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Solo el comprador y el organizador pueden escribir en este chat
        '404':
          $ref: '#/components/responses/CompraNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /compras/{id}/mensajes/lectura:
    put:
      tags: [Compras]
      summary: Marcar el chat de una compra como leído
      description: >-
        Solo para el comprador y el organizador del evento. Todos los mensajes hasta
        este momento quedan leídos para quien lo pide (el otro no cambia), y también
        las notificaciones de esos mensajes. La app lo llama al abrir el chat y
        cuando llegan mensajes nuevos con el chat abierto.
      operationId: markMensajesReadCompra
      security:
        - usuarioActivo: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '204':
          description: El chat quedó leído
        '400':
          $ref: '#/components/responses/IdInvalido'
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '403':
          description: El usuario activo no es el comprador ni el organizador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Solo el comprador y el organizador pueden leer este chat
        '404':
          $ref: '#/components/responses/CompraNoEncontrada'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /resenias:
    post:
      tags: [Resenias]
      summary: Reseñar un evento
      description: >-
        El comprador es el usuario activo. Solo puede reseñar si tiene una compra
        UTILIZADA de ese evento, y una sola vez por evento.
      operationId: createResenia
      security:
        - usuarioActivo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventoId, puntuacion, detalle]
              properties:
                eventoId:
                  type: integer
                puntuacion:
                  type: integer
                  minimum: 1
                  maximum: 5
                detalle:
                  type: string
                  maxLength: 500
            example:
              eventoId: 6
              puntuacion: 4
              detalle: Muy divertido, aunque el sonido fallaba atrás.
      responses:
        '201':
          description: La reseña creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReseniaDetalle'
        '400':
          description: Falta un campo, es inválido o no existe el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El campo puntuacion tiene que ser como máximo 5
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '409':
          description: No tiene una compra UTILIZADA del evento o ya lo reseñó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Solo podés reseñar eventos a los que asististe
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  parameters:
    CompraId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
    Pagina:
      name: pagina
      in: query
      description: Número de página, desde 1. Una página después de la última viene vacía.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    Limite:
      name: limite
      in: query
      description: Cantidad de resultados por página
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      example: 10
  securitySchemes:
    usuarioActivo:
      type: apiKey
      in: header
      name: X-User-Id
      description: >-
        Id del usuario activo, el que devuelve POST /sesiones. Ej. 1 = Lucía,
        2 = Martín, 3 = Sofía, 4 = Juan.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Recurso no encontrado
    Pagina:
      type: object
      description: >-
        Datos de una página de un listado. Cada listado paginado suma `resultados`
        con sus elementos (ver cada endpoint).
      required: [pagina, limite, total, hayMas]
      properties:
        pagina:
          type: integer
          example: 1
        limite:
          type: integer
          example: 10
        total:
          type: integer
          description: Cantidad de resultados en todas las páginas
          example: 18
        hayMas:
          type: boolean
          description: Si hay una página siguiente con resultados
          example: true
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nombre:
          type: string
          example: Sofía
        apellido:
          type: string
          example: Pérez
        favoritos:
          type: array
          description: Ids de los eventos favoritos
          items:
            type: integer
          example: []
    Cuenta:
      description: El usuario visto por él mismo, con su email. Nunca incluye la contraseña.
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            email:
              type: string
              example: sofia@aiticketit.com
            notificacionesLeidasHasta:
              type: string
              format: date-time
              nullable: true
              description: La última vez que marcó todas las notificaciones como leídas (null si nunca)
            notificacionesLeidas:
              type: array
              description: Ids de las notificaciones que abrió una por una después de esa fecha
              items:
                type: string
              example: [compra-1-mensaje-1]
    Notificacion:
      type: object
      description: >-
        Algo que hizo otra persona. Según el tipo trae `estado` (COMPRA y
        CAMBIO_ESTADO), `mensaje` (MENSAJE) o `puntuacion` (RESENIA); todas menos
        RESENIA traen `compra`.
      properties:
        id:
          type: string
          description: Identifica la notificación en la lista (se arma con lo que la origina)
          example: compra-3-mensaje-0
        tipo:
          type: string
          enum: [COMPRA, CAMBIO_ESTADO, MENSAJE, RESENIA]
          example: MENSAJE
        fecha:
          type: string
          format: date-time
        leida:
          type: boolean
          example: false
        de:
          type: object
          description: Quién la originó
          properties:
            id:
              type: integer
              example: 4
            nombre:
              type: string
              example: Juan
            apellido:
              type: string
              example: Rodríguez
        evento:
          type: object
          properties:
            id:
              type: integer
              example: 3
            nombre:
              type: string
              example: Festival de Verano
        compra:
          type: object
          properties:
            id:
              type: integer
              example: 3
            estado:
              type: string
              description: Estado actual de la compra
              example: CONFIRMADA
            cantidad:
              type: integer
              example: 2
            tipoEntrada:
              type: string
              example: Backstage
        estado:
          type: string
          description: El estado al que pasó la compra (COMPRA y CAMBIO_ESTADO)
          example: REEMBOLSADA
        mensaje:
          type: string
          description: El texto del mensaje (MENSAJE)
          example: ¿El Backstage incluye estacionamiento?
        puntuacion:
          type: integer
          description: La puntuación de la reseña (RESENIA)
          example: 5
    UsuarioPerfil:
      description: Un usuario con su puntaje como organizador
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          properties:
            puntaje:
              type: number
              nullable: true
              description: Calculado. Promedio de las reseñas de sus eventos; null si no tiene
              example: 4.5
            cantidadResenias:
              type: integer
              example: 2
    Categoria:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Música
        descripcion:
          type: string
          example: Recitales, conciertos y shows en vivo
    TipoEntrada:
      type: object
      properties:
        id:
          type: integer
          description: Id dentro del evento (1, 2, 3…)
          example: 3
        nombre:
          type: string
          example: Backstage
        descripcion:
          type: string
          example: Encuentro con los artistas
        precio:
          type: number
          example: 350000
        cupo:
          type: integer
          example: 2
        disponibles:
          type: integer
          description: Calculado. Cupo menos las entradas de compras PENDIENTE, CONFIRMADA o UTILIZADA.
          example: 0
    EventoDetalle:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nombre:
          type: string
          example: Festival de Verano
        descripcion:
          type: string
          example: Tres días de música, food trucks y artistas invitados
        lugar:
          type: string
          example: Hipódromo de San Isidro, Av. Márquez 504, San Isidro
        fecha:
          type: string
          format: date-time
          example: '2027-01-01T19:00:00.000Z'
        multimedia:
          type: array
          items:
            type: string
          example: ['https://picsum.photos/seed/festival/800/400']
        categoria:
          type: object
          properties:
            id:
              type: integer
              example: 4
            nombre:
              type: string
              example: Festivales
        organizador:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nombre:
              type: string
              example: Lucía
            apellido:
              type: string
              example: Fernández
            puntaje:
              type: number
              nullable: true
              description: Calculado. Promedio de las reseñas de sus eventos; null si no tiene
              example: 4.5
            cantidadResenias:
              type: integer
              example: 2
        tiposEntrada:
          type: array
          items:
            $ref: '#/components/schemas/TipoEntrada'
    EventoResumen:
      type: object
      description: Un evento en el catálogo, sin los tipos de entrada
      properties:
        id:
          type: integer
          example: 2
        nombre:
          type: string
          example: La casa de Bernarda Alba
        lugar:
          type: string
          example: Teatro San Martín, Av. Corrientes 1530, CABA
        fecha:
          type: string
          format: date-time
          example: '2026-11-07T23:00:00.000Z'
        imagen:
          type: string
          nullable: true
          description: Primera URL de multimedia, o null si no tiene
          example: https://picsum.photos/seed/bernarda/800/400
        categoria:
          type: object
          properties:
            id:
              type: integer
              example: 2
            nombre:
              type: string
              example: Teatro
        organizador:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nombre:
              type: string
              example: Lucía
            apellido:
              type: string
              example: Fernández
            puntaje:
              type: number
              nullable: true
              description: Calculado. Promedio de las reseñas de sus eventos; null si no tiene
              example: 4.5
            cantidadResenias:
              type: integer
              example: 2
        precioDesde:
          type: number
          description: Calculado. Precio de su entrada más barata
          example: 20000
    EventoOrganizado:
      description: Un evento en Mis eventos del organizador
      allOf:
        - $ref: '#/components/schemas/EventoResumen'
        - type: object
          properties:
            conMensajesNoLeidos:
              type: integer
              description: >-
                Calculado. Cantidad de compras del evento con mensajes del comprador que
                el organizador todavía no leyó. 0 si no hay ninguna
              example: 1
    CambioEstadoCompra:
      type: object
      properties:
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, UTILIZADA, CANCELADA, REEMBOLSADA]
        usuarioId:
          type: integer
          description: Quién hizo el cambio
        fechaHora:
          type: string
          format: date-time
    Mensaje:
      type: object
      properties:
        usuarioId:
          type: integer
        mensaje:
          type: string
        enviado:
          type: string
          format: date-time
    ReseniaDetalle:
      type: object
      properties:
        id:
          type: integer
          example: 3
        comprador:
          type: object
          properties:
            id:
              type: integer
              example: 3
            nombre:
              type: string
              example: Sofía
            apellido:
              type: string
              example: Pérez
        evento:
          type: object
          properties:
            id:
              type: integer
              example: 6
            nombre:
              type: string
              example: Noche de Stand-up
            fecha:
              type: string
              format: date-time
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        detalle:
          type: string
          example: Muy divertido, aunque el sonido fallaba atrás.
    MensajeConAutor:
      type: object
      properties:
        autor:
          type: object
          properties:
            id:
              type: integer
              example: 3
            nombre:
              type: string
              example: Sofía
            apellido:
              type: string
              example: Pérez
        mensaje:
          type: string
          example: ¿Se puede entrar con mochila?
        enviado:
          type: string
          format: date-time
    CompraDetalle:
      type: object
      properties:
        id:
          type: integer
          example: 10
        evento:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nombre:
              type: string
              example: Noche de Rock Nacional
            fecha:
              type: string
              format: date-time
            lugar:
              type: string
              example: Estadio Obras, Av. del Libertador 7395, CABA
            organizadorId:
              type: integer
              example: 1
        tipoEntrada:
          type: object
          properties:
            id:
              type: integer
              example: 2
            nombre:
              type: string
              example: Platea
            precio:
              type: number
              example: 80000
        comprador:
          type: object
          properties:
            id:
              type: integer
              example: 3
            nombre:
              type: string
              example: Sofía
            apellido:
              type: string
              example: Pérez
        cantidad:
          type: integer
          example: 2
        total:
          type: number
          description: Precio al momento de comprar × cantidad
          example: 160000
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADA, UTILIZADA, CANCELADA, REEMBOLSADA]
          example: PENDIENTE
        historial:
          type: array
          description: Cambios de estado en orden cronológico
          items:
            $ref: '#/components/schemas/CambioEstadoCompra'
        mensajes:
          type: array
          description: Chat de la compra
          items:
            $ref: '#/components/schemas/Mensaje'
        diasRestantes:
          type: integer
          nullable: true
          description: >-
            Calculado. Días de calendario hasta el evento (0 = hoy). Solo si la
            compra está CONFIRMADA y el evento no se realizó; si no, null.
          example: 20
        mensajesNoLeidos:
          type: integer
          description: >-
            Calculado para el usuario activo. Mensajes del otro participante que
            escribió después de la última vez que abrió el chat.
          example: 1
        resenia:
          type: object
          nullable: true
          description: >-
            La reseña que dejó el comprador para el evento de la compra, o null si
            todavía no reseñó. La app la muestra en lugar del formulario.
          properties:
            id:
              type: integer
              example: 1
            puntuacion:
              type: integer
              example: 5
            detalle:
              type: string
              example: Sonido impecable y muy buena organización en la entrada.
    NuevaCompra:
      type: object
      required: [eventoId, tipoEntradaId, cantidad]
      properties:
        eventoId:
          type: integer
        tipoEntradaId:
          type: integer
          description: Id del tipo de entrada dentro del evento (1, 2, 3…)
        cantidad:
          type: integer
          minimum: 1
      example:
        eventoId: 1
        tipoEntradaId: 2
        cantidad: 2
    NuevoEvento:
      type: object
      required: [nombre, descripcion, lugar, categoriaId, fecha, tiposEntrada]
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        lugar:
          type: string
        categoriaId:
          type: integer
        fecha:
          type: string
          format: date-time
          description: Tiene que ser futura
        multimedia:
          type: array
          description: URLs de imágenes (http o https). Si falta, queda vacío.
          items:
            type: string
        tiposEntrada:
          type: array
          minItems: 1
          items:
            type: object
            required: [nombre, descripcion, precio, cupo]
            properties:
              nombre:
                type: string
              descripcion:
                type: string
              precio:
                type: number
                minimum: 0
              cupo:
                type: integer
                minimum: 1
      example:
        nombre: Meetup de JavaScript
        descripcion: Charlas cortas sobre el ecosistema JS
        lugar: UTN FRBA, Medrano 951, CABA
        categoriaId: 5
        fecha: '2027-03-15T19:00:00.000Z'
        multimedia: []
        tiposEntrada:
          - nombre: General
            descripcion: Entrada libre con registro
            precio: 0
            cupo: 100
          - nombre: Con certificado
            descripcion: Incluye certificado de asistencia
            precio: 5000
            cupo: 30
  responses:
    IdInvalido:
      description: El id no es un número válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: El campo id tiene que ser un id válido
    CompraNoEncontrada:
      description: No existe la compra
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: No existe la compra 99
    SinUsuarioActivo:
      description: Falta el header X-User-Id, es inválido o el usuario no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Falta indicar el usuario activo
    NotificacionesAjenas:
      description: El usuario activo no es el dueño de las notificaciones
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Solo podés ver tus propias notificaciones.
    FavoritosAjenos:
      description: El usuario activo no es el dueño de los favoritos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Solo podés ver y cambiar tus propios favoritos.
    ErrorInterno:
      description: Error no previsto del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Error interno del servidor
