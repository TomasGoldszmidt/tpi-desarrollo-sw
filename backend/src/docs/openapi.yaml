        nombre:
          type: string
          example: Backstage
        descripcion:
          type: string
          example: Encuentro con los artistas
        precio:
          type: number
          example: 350000
        cupo:
          type: integer
          example: 2
        disponibles:
          type: integer
          description: Calculado. Cupo menos las entradas de compras PENDIENTE, CONFIRMADA o UTILIZADA.
          example: 0
    EventoDetalle:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nombre:
          type: string
          example: Festival de Verano
        descripcion:
          type: string
          example: Tres días de música, food trucks y artistas invitados
        lugar:
          type: string
          example: Hipódromo de San Isidro, Av. Márquez 504, San Isidro
        fecha:
          type: string
          format: date-time
          example: '2027-01-01T19:00:00.000Z'
        multimedia:
          type: array
          items:
            type: string
          example: ['https://picsum.photos/seed/festival/800/400']
        categoria:
          type: object
          properties:
            id:
              type: integer
              example: 4
            nombre:
              type: string
              example: Festivales
        organizador:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nombre:
              type: string
              example: Lucía
            apellido:
              type: string
              example: Fernández
            puntaje:
              type: number
