openapi: 3.0.3
info:
  title: AI Ticket It API
  description: >-
    Backend de AI Ticket It, plataforma de venta de entradas para eventos.
    Persistencia en memoria: los datos vuelven al seed en cada reinicio.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: Sistema
    description: Estado del servidor
  - name: Usuarios
    description: Usuarios del sistema (no hay login, se elige el usuario activo)
  - name: Categorias
    description: Categorías para explorar y clasificar los eventos
  - name: Eventos
    description: Eventos con sus tipos de entrada
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verificar que el servidor está activo
      operationId: health
      responses:
        '200':
          description: El servidor responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar los usuarios
      description: >-
        La app lo usa para elegir el usuario activo, cuyo id se manda después
        en el header X-User-Id.
      operationId: listUsuarios
      responses:
        '200':
          description: Todos los usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /categorias:
    get:
      tags: [Categorias]
      summary: Listar las categorías
      operationId: listCategorias
      responses:
        '200':
          description: Todas las categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /eventos:
    get:
      tags: [Eventos]
      summary: Buscar eventos
      description: >-
        Solo muestra eventos que todavía no se realizaron. Todos los filtros son
        opcionales. Orden: fecha y precio de menor a mayor; puntaje de mayor a
        menor, con los organizadores sin reseñas al final. Si empatan, desempata
        la fecha.
      operationId: listEventos
      parameters:
        - name: texto
          in: query
          description: Se busca en el nombre, la descripción y el lugar, sin distinguir mayúsculas ni tildes
          schema:
            type: string
          example: rock
        - name: categoriaId
          in: query
          schema:
            type: integer
          example: 1
        - name: precioMin
          in: query
          description: Algún tipo de entrada tiene que costar al menos esto
          schema:
            type: number
            minimum: 0
        - name: precioMax
          in: query
          description: Algún tipo de entrada tiene que costar como mucho esto
          schema:
            type: number
            minimum: 0
        - name: orden
          in: query
          schema:
            type: string
            enum: [fecha, precio, puntaje]
            default: fecha
      responses:
        '200':
          description: Los eventos que cumplen los filtros (puede ser vacío)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoResumen'
        '400':
          description: Un filtro tiene un formato inválido o precioMin es mayor que precioMax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'El campo orden tiene que ser uno de: fecha, precio, puntaje'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [Eventos]
      summary: Crear un evento con sus tipos de entrada
      description: >-
        El organizador es el usuario activo. La categoría tiene que existir, la
        fecha tiene que ser futura y los tipos de entrada no pueden repetir nombre
        (sin distinguir mayúsculas).
      operationId: createEvento
      security:
        - usuarioActivo: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoEvento'
      responses:
        '201':
          description: El evento creado, con la misma forma que el detalle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDetalle'
        '400':
          description: Falta un campo, tiene un formato inválido o la categoría no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El campo tiposEntrada[0].cupo tiene que ser como mínimo 1
        '401':
          $ref: '#/components/responses/SinUsuarioActivo'
        '409':
          description: La fecha no es futura o hay tipos de entrada con el nombre repetido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: La fecha del evento tiene que ser futura
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /eventos/{id}:
    get:
      tags: [Eventos]
      summary: Ver el detalle de un evento
      description: Incluye las entradas disponibles de cada tipo, calculadas con las compras que ocupan cupo.
      operationId: getEventoById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 3
      responses:
        '200':
          description: El evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDetalle'
        '400':
          description: El id no es un número válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El campo id tiene que ser un id válido
        '404':
          description: No existe el evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No existe el evento 99
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    usuarioActivo:
      type: apiKey
      in: header
      name: X-User-Id
      description: Id del usuario activo (no hay login). Ej. 1 = Lucía, 2 = Martín, 3 = Sofía, 4 = Juan.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Recurso no encontrado
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nombre:
          type: string
          example: Sofía
        apellido:
          type: string
          example: Pérez
        favoritos:
          type: array
          description: Ids de los eventos favoritos
          items:
            type: integer
          example: []
    Categoria:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Música
        descripcion:
          type: string
          example: Recitales, conciertos y shows en vivo
    TipoEntrada:
      type: object
      properties:
        id:
          type: integer
          description: Id dentro del evento (1, 2, 3…)
          example: 3
        nombre:
          type: string
          example: Backstage
        descripcion:
          type: string
          example: Encuentro con los artistas
        precio:
          type: number
          example: 350000
        cupo:
          type: integer
          example: 2
        disponibles:
          type: integer
          description: Calculado. Cupo menos las entradas de compras PENDIENTE, CONFIRMADA o UTILIZADA.
          example: 0
    EventoDetalle:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nombre:
          type: string
          example: Festival de Verano
        descripcion:
          type: string
          example: Tres días de música, food trucks y artistas invitados
        lugar:
          type: string
          example: Hipódromo de San Isidro, Av. Márquez 504, San Isidro
        fecha:
          type: string
          format: date-time
          example: '2027-01-01T19:00:00.000Z'
        multimedia:
          type: array
          items:
            type: string
          example: ['https://picsum.photos/seed/festival/800/400']
        categoria:
          type: object
          properties:
            id:
              type: integer
              example: 4
            nombre:
              type: string
              example: Festivales
        organizador:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nombre:
              type: string
              example: Lucía
            apellido:
              type: string
              example: Fernández
        tiposEntrada:
          type: array
          items:
            $ref: '#/components/schemas/TipoEntrada'
    EventoResumen:
      type: object
      description: Un evento en el catálogo, sin los tipos de entrada
      properties:
        id:
          type: integer
          example: 2
        nombre:
          type: string
          example: La casa de Bernarda Alba
        lugar:
          type: string
          example: Teatro San Martín, Av. Corrientes 1530, CABA
        fecha:
          type: string
          format: date-time
          example: '2026-11-07T23:00:00.000Z'
        imagen:
          type: string
          nullable: true
          description: Primera URL de multimedia, o null si no tiene
          example: https://picsum.photos/seed/bernarda/800/400
        categoria:
          type: object
          properties:
            id:
              type: integer
              example: 2
            nombre:
              type: string
              example: Teatro
        organizador:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nombre:
              type: string
              example: Lucía
            apellido:
              type: string
              example: Fernández
            puntaje:
              type: number
              nullable: true
              description: Calculado. Promedio de las reseñas de sus eventos; null si no tiene
              example: 4.5
            cantidadResenias:
              type: integer
              example: 2
        precioDesde:
          type: number
          description: Calculado. Precio de su entrada más barata
          example: 20000
    NuevoEvento:
      type: object
      required: [nombre, descripcion, lugar, categoriaId, fecha, tiposEntrada]
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        lugar:
          type: string
        categoriaId:
          type: integer
        fecha:
          type: string
          format: date-time
          description: Tiene que ser futura
        multimedia:
          type: array
          description: URLs de imágenes. Si falta, queda vacío.
          items:
            type: string
        tiposEntrada:
          type: array
          minItems: 1
          items:
            type: object
            required: [nombre, descripcion, precio, cupo]
            properties:
              nombre:
                type: string
              descripcion:
                type: string
              precio:
                type: number
                minimum: 0
              cupo:
                type: integer
                minimum: 1
      example:
        nombre: Meetup de JavaScript
        descripcion: Charlas cortas sobre el ecosistema JS
        lugar: UTN FRBA, Medrano 951, CABA
        categoriaId: 5
        fecha: '2027-03-15T19:00:00.000Z'
        multimedia: []
        tiposEntrada:
          - nombre: General
            descripcion: Entrada libre con registro
            precio: 0
            cupo: 100
          - nombre: Con certificado
            descripcion: Incluye certificado de asistencia
            precio: 5000
            cupo: 30
  responses:
    SinUsuarioActivo:
      description: Falta el header X-User-Id, es inválido o el usuario no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Falta indicar el usuario activo
    ErrorInterno:
      description: Error no previsto del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Error interno del servidor
